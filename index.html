<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Portal USDA - Partners of the Americas - McGovern-Dole Honduras
  </title>


  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f6f9;

      color: #243447;

      overflow: hidden;

    }


    /* =====================================================
       ENCABEZADO INSTITUCIONAL
       ===================================================== */

    .header {

      width: 100%;

      height: 92px;

      background: #E85D3F;

      color: white;

      display: flex;

      align-items: center;

      padding: 0 28px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.18);

      position: relative;

      z-index: 20;

    }


    .title-area {

      width: 100%;

      min-width: 0;

    }


    .title-area h1 {

      margin: 0;

      font-size: 18px;

      font-weight: 600;

      line-height: 1.3;

      max-width: 1500px;

    }


    /* =====================================================
       BARRA DE CATEGORÍAS
       ===================================================== */

    .category-bar {

      width: 100%;

      height: 58px;

      background: #ffffff;

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 0 18px;

      border-bottom:
        1px solid #d9e1e8;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08);

      position: relative;

      z-index: 20;

      overflow-x: auto;

      overflow-y: hidden;

      scrollbar-width: thin;

    }


    .category-label {

      font-size: 13px;

      font-weight: 600;

      color: #4d6272;

      margin-right: 5px;

      white-space: nowrap;

    }


    /* =====================================================
       BOTONES DE CATEGORÍA
       ===================================================== */

    .category-button {

      height: 36px;

      border:
        1px solid #d5e0e7;

      background: #f7f9fb;

      padding: 0 20px;

      border-radius: 6px;

      cursor: pointer;

      color: #4d6272;

      font-size: 13px;

      font-weight: 600;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border 0.2s ease;

      flex-shrink: 0;

    }


    .category-button:hover {

      background: #fff0ec;

      color: #d94d32;

      border-color: #e7aa9c;

    }


    .category-button.active {

      background: #E85D3F;

      color: white;

      border-color: #E85D3F;

    }


    /* =====================================================
       BARRA DE MÓDULOS
       ===================================================== */

    .navigation {

      width: 100%;

      height: 58px;

      background: #ffffff;

      display: flex;

      align-items: center;

      gap: 5px;

      padding: 0 14px;

      border-bottom:
        1px solid #d9e1e8;

      position: relative;

      z-index: 19;

      overflow-x: auto;

      overflow-y: hidden;

      scrollbar-width: thin;

    }


    /* =====================================================
       PESTAÑAS DE MÓDULOS
       ===================================================== */

    .tab {

      height: 38px;

      border: none;

      background: transparent;

      padding: 0 15px;

      border-radius: 6px;

      cursor: pointer;

      color: #4d6272;

      font-size: 13px;

      font-weight: 500;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        color 0.2s ease;

      flex-shrink: 0;

      display: block;

    }


    .tab:hover {

      background: #fff0ec;

      color: #d94d32;

    }


    .tab.active {

      background: #E85D3F;

      color: white;

      font-weight: 600;

    }


    /* =====================================================
       MÓDULOS OCULTOS POR FILTRO
       ===================================================== */

    .tab.hidden {

      display: none;

    }


    /* =====================================================
       SELECTOR PARA CELULARES
       ===================================================== */

    .selector {

      display: none;

      margin-left: auto;

      flex-shrink: 0;

    }


    .selector select {

      padding: 9px 12px;

      border:
        1px solid #ccd6df;

      border-radius: 6px;

      background: white;

      color: #243447;

      font-size: 14px;

      min-width: 240px;

      outline: none;

    }


    /* =====================================================
       ÁREA DEL DASHBOARD
       ===================================================== */

    .viewer {

      position: relative;

      width: 100%;

      height:
        calc(100vh - 208px);

      overflow: hidden;

      background: #ffffff;

    }


    /* =====================================================
       IFRAME
       ===================================================== */

    iframe {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      border: none;

      display: block;

      background: #ffffff;

    }


    /* =====================================================
       PANTALLA DE CARGA
       ===================================================== */

    .loading {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255, 255, 255, 0.97);

      z-index: 10;

      color: #d94d32;

      font-size: 16px;

      font-weight: 500;

    }


    .loading-content {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .spinner {

      width: 27px;

      height: 27px;

      border:
        3px solid #f5d9d2;

      border-top:
        3px solid #E85D3F;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 1100px) {

      .title-area h1 {

        font-size: 16px;

      }


      .category-button {

        padding: 0 14px;

      }


      .tab {

        padding: 0 11px;

        font-size: 12px;

      }

    }


    /* =====================================================
       CELULAR
       ===================================================== */

    @media (max-width: 850px) {

      .header {

        height: 82px;

        padding: 0 16px;

      }


      .title-area h1 {

        font-size: 15px;

        line-height: 1.25;

      }


      .category-bar {

        height: 55px;

        padding: 0 10px;

        justify-content: flex-start;

      }


      .category-label {

        display: none;

      }


      .category-button {

        padding: 0 14px;

      }


      .navigation {

        height: 58px;

        justify-content: flex-end;

      }


      .tab {

        display: none;

      }


      .selector {

        display: block;

      }


      .viewer {

        height:
          calc(100vh - 195px);

      }

    }


    /* =====================================================
       CELULARES PEQUEÑOS
       ===================================================== */

    @media (max-width: 500px) {

      .header {

        height: 88px;

      }


      .title-area h1 {

        font-size: 13px;

      }


      .selector select {

        min-width: 190px;

        max-width: 100%;

      }


      .viewer {

        height:
          calc(100vh - 201px);

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="header">

    <div class="title-area">

      <h1>

        Portal United States Department of Agriculture (USDA)
        - PARTNERS of the AMERICAS (POA) -
        McGovern-Dole Alimentos para la Educación y Nutrición
        Infantil – Honduras

      </h1>

    </div>

  </header>



  <!-- =====================================================
       FILTRO DE CATEGORÍAS
       ===================================================== -->

  <div class="category-bar">

    <span class="category-label">
      Categoría:
    </span>


    <!-- TODOS -->

    <button
      class="category-button active"
      onclick="filtrarCategoria('TODOS')"
    >
      Todos
    </button>


    <!-- ALE -->

    <button
      class="category-button"
      onclick="filtrarCategoria('ALE')"
    >
      ALE
    </button>


    <!-- WASH -->

    <button
      class="category-button"
      onclick="filtrarCategoria('WASH')"
    >
      WASH
    </button>


    <!-- EDU -->

    <button
      class="category-button"
      onclick="filtrarCategoria('EDU')"
    >
      EDU
    </button>

  </div>



  <!-- =====================================================
       NAVEGACIÓN DE MÓDULOS
       ===================================================== -->

  <nav class="navigation">


    <!-- =================================================
         1. ALE - LIDERAZGO
         ================================================= -->

    <button
      class="tab active"
      data-categoria="ALE"
      onclick="cargarDashboard(0)"
    >

      ALE_ Taller Liderazgo Docente

    </button>



    <!-- =================================================
         2. ALE - CAE
         ================================================= -->

    <button
      class="tab"
      data-categoria="ALE"
      onclick="cargarDashboard(1)"
    >

      ALE_ Manejo de Seguro de alimentos CAE

    </button>



    <!-- =================================================
         3. WASH - ACTA
         ================================================= -->

    <button
      class="tab"
      data-categoria="WASH"
      onclick="cargarDashboard(2)"
    >

      WASH_ Acta de entrega de material por Centro Educativo

    </button>



    <!-- =================================================
         4. ALE - MANTENIMIENTO
         ================================================= -->

    <button
      class="tab"
      data-categoria="ALE"
      onclick="cargarDashboard(3)"
    >

      Ale_ Registro de actividades de mantenimiento

    </button>



    <!-- =================================================
         5. EDU - ACOMPAÑAMIENTO
         ================================================= -->

    <button
      class="tab"
      data-categoria="EDU"
      onclick="cargarDashboard(4)"
    >

      EDU_ Acompañamiento y Monitoreo

    </button>



    <!-- =================================================
         6. WASH - OPERACIÓN
         ================================================= -->

    <button
      class="tab"
      data-categoria="WASH"
      onclick="cargarDashboard(5)"
    >

      WASH_ Operacion y Mantenimiento

    </button>



    <!-- =================================================
         SELECTOR PARA CELULAR
         ================================================= -->

    <div class="selector">

      <select
        id="dashboardSelect"
        onchange="cargarDashboard(this.value)"
      >

        <option value="0">
          ALE_ Taller Liderazgo Docente
        </option>

        <option value="1">
          ALE_ Manejo de Seguro de alimentos CAE
        </option>

        <option value="2">
          WASH_ Acta de entrega de material por Centro Educativo
        </option>

        <option value="3">
          Ale_ Registro de actividades de mantenimiento
        </option>

        <option value="4">
          EDU_ Acompañamiento y Monitoreo
        </option>

        <option value="5">
          WASH_ Operacion y Mantenimiento
        </option>

      </select>

    </div>

  </nav>



  <!-- =====================================================
       VISOR
       ===================================================== -->

  <main class="viewer">


    <!-- PANTALLA DE CARGA -->

    <div
      class="loading"
      id="loading"
    >

      <div class="loading-content">

        <div class="spinner"></div>

        <span>
          Cargando dashboard...
        </span>

      </div>

    </div>



    <!-- DASHBOARD -->

    <iframe
      id="dashboard"
      title="Dashboard"
      src=""
      allowfullscreen
    >
    </iframe>


  </main>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       URL DE LOS 6 DASHBOARDS
       ===================================================== */

    const dashboards = [

      // 0 - ALE_ Taller Liderazgo Docente

      "https://oswaldoayala13.github.io/Taller-de-Liderazgo-Docente/",


      // 1 - ALE_ Manejo de Seguro de alimentos CAE

      "https://oswaldoayala13.github.io/ALE_Manejo-de-seguro-de-alimentos-CAE/",


      // 2 - WASH_ Acta de entrega de material por Centro Educativo

      "https://oswaldoayala13.github.io/WASH-CENTRO-EDUCATIVO/",


      // 3 - Ale_ Registro de actividades de mantenimiento

      "https://oswaldoayala13.github.io/ALE_MANTENIMIENTO/",


      // 4 - EDU_ Acompañamiento y Monitoreo

      "https://oswaldoayala13.github.io/EDU_ACOMPANAMIENTO/",


      // 5 - WASH_ Operacion y Mantenimiento

      "https://oswaldoayala13.github.io/WASH_Operacion_y_mantenimiento/"

    ];



    /* =====================================================
       CATEGORÍAS DE CADA DASHBOARD
       ===================================================== */

    const categorias = [

      "ALE",
      "ALE",
      "WASH",
      "ALE",
      "EDU",
      "WASH"

    ];



    /* =====================================================
       ELEMENTOS HTML
       ===================================================== */

    const iframe =
      document.getElementById("dashboard");


    const loading =
      document.getElementById("loading");


    const tabs =
      document.querySelectorAll(".tab");


    const categoryButtons =
      document.querySelectorAll(".category-button");


    const selector =
      document.getElementById("dashboardSelect");



    /* =====================================================
       CARGAR DASHBOARD
       ===================================================== */

    function cargarDashboard(indice) {


      /* Convertir a número */

      indice =
        Number(indice);


      /* Validar */

      if (
        indice < 0 ||
        indice >= dashboards.length
      ) {

        indice = 0;

      }


      /* Mostrar pantalla de carga */

      loading.style.display =
        "flex";


      /* Cambiar dashboard */

      iframe.src =
        dashboards[indice];


      /* Actualizar pestañas */

      tabs.forEach(
        (tab, i) => {

          if (i === indice) {

            tab.classList.add(
              "active"
            );

          } else {

            tab.classList.remove(
              "active"
            );

          }

        }
      );


      /* Actualizar selector */

      selector.value =
        indice;

    }



    /* =====================================================
       FILTRAR POR CATEGORÍA
       ===================================================== */

    function filtrarCategoria(categoria) {


      /* -------------------------------------------------
         Actualizar botón activo
         ------------------------------------------------- */

      categoryButtons.forEach(
        button => {

          button.classList.remove(
            "active"
          );

        }
      );


      categoryButtons.forEach(
        button => {

          if (
            button.textContent
              .trim()
              .toUpperCase() === categoria
          ) {

            button.classList.add(
              "active"
            );

          }

        }
      );



      /* -------------------------------------------------
         Mostrar / ocultar módulos
         ------------------------------------------------- */

      let primerModulo = null;


      tabs.forEach(
        (tab, indice) => {

          const categoriaModulo =
            tab.dataset.categoria;


          if (
            categoria === "TODOS" ||
            categoriaModulo === categoria
          ) {

            tab.classList.remove(
              "hidden"
            );


            /*
             * Guardar primer módulo
             * de la categoría
             */

            if (
              primerModulo === null
            ) {

              primerModulo = indice;

            }

          } else {

            tab.classList.add(
              "hidden"
            );

          }

        }
      );



      /* -------------------------------------------------
         Cargar primer módulo
         ------------------------------------------------- */

      if (
        primerModulo !== null
      ) {

        cargarDashboard(
          primerModulo
        );

      }

    }



    /* =====================================================
       CUANDO TERMINA DE CARGAR EL IFRAME
       ===================================================== */

    iframe.addEventListener(
      "load",
      function() {

        loading.style.display =
          "none";

      }
    );



    /* =====================================================
       DASHBOARD INICIAL
       ===================================================== */

    cargarDashboard(0);


  </script>


</body>

</html>
