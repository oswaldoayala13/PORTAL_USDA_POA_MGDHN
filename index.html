<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portal USDA - POA MGDHN</title>


  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f6f9;

      color: #243447;

      overflow: hidden;

    }


    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .header {

      width: 100%;
      height: 76px;

      background: #005b96;

      color: white;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 25px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.18);

      position: relative;

      z-index: 20;

    }


    .title-area {

      min-width: 0;

    }


    .title-area h1 {

      margin: 0;

      font-size: 23px;

      font-weight: 600;

      line-height: 1.2;

    }


    .title-area p {

      margin: 4px 0 0 0;

      font-size: 13px;

      opacity: 0.92;

    }


    .logo {

      font-size: 24px;

      font-weight: 700;

      letter-spacing: 1px;

      white-space: nowrap;

    }


    /* =====================================================
       BARRA DE NAVEGACIÓN
       ===================================================== */

    .navigation {

      width: 100%;

      height: 58px;

      background: #ffffff;

      display: flex;

      align-items: center;

      gap: 5px;

      padding: 0 14px;

      border-bottom:
        1px solid #d9e1e8;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08);

      position: relative;

      z-index: 20;

      overflow-x: auto;

      overflow-y: hidden;

      scrollbar-width: thin;

    }


    /* =====================================================
       PESTAÑAS
       ===================================================== */

    .tab {

      height: 38px;

      border: none;

      background: transparent;

      padding: 0 15px;

      border-radius: 6px;

      cursor: pointer;

      color: #4d6272;

      font-size: 13px;

      font-weight: 500;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        color 0.2s ease;

      flex-shrink: 0;

    }


    .tab:hover {

      background: #eaf3f8;

      color: #005b96;

    }


    .tab.active {

      background: #005b96;

      color: white;

      font-weight: 600;

    }


    /* =====================================================
       SELECTOR PARA CELULARES
       ===================================================== */

    .selector {

      display: none;

      margin-left: auto;

      flex-shrink: 0;

    }


    .selector select {

      padding: 9px 12px;

      border:
        1px solid #ccd6df;

      border-radius: 6px;

      background: white;

      color: #243447;

      font-size: 14px;

      min-width: 230px;

      outline: none;

    }


    /* =====================================================
       ÁREA DEL DASHBOARD
       ===================================================== */

    .viewer {

      position: relative;

      width: 100%;

      height:
        calc(100vh - 134px);

      overflow: hidden;

      background: #ffffff;

    }


    /* =====================================================
       IFRAME
       ===================================================== */

    iframe {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      background: #ffffff;

    }


    /* =====================================================
       PANTALLA DE CARGA
       ===================================================== */

    .loading {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255, 255, 255, 0.97);

      z-index: 10;

      color: #005b96;

      font-size: 16px;

      font-weight: 500;

    }


    .loading-content {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .spinner {

      width: 27px;

      height: 27px;

      border:
        3px solid #d9e7ef;

      border-top:
        3px solid #005b96;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 1100px) {

      .tab {

        padding: 0 11px;

        font-size: 12px;

      }

      .title-area h1 {

        font-size: 21px;

      }

    }


    /* =====================================================
       CELULAR
       ===================================================== */

    @media (max-width: 850px) {

      .header {

        height: 70px;

        padding: 0 16px;

      }


      .title-area h1 {

        font-size: 19px;

      }


      .title-area p {

        font-size: 11px;

      }


      .logo {

        font-size: 21px;

      }


      .navigation {

        height: 58px;

        justify-content: flex-end;

      }


      .tab {

        display: none;

      }


      .selector {

        display: block;

      }


      .viewer {

        height:
          calc(100vh - 128px);

      }

    }


    /* =====================================================
       CELULARES PEQUEÑOS
       ===================================================== */

    @media (max-width: 500px) {

      .title-area h1 {

        font-size: 16px;

      }


      .title-area p {

        display: none;

      }


      .logo {

        font-size: 18px;

      }


      .selector select {

        min-width: 190px;

        max-width: 100%;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="header">

    <div class="title-area">

      <h1>
        Portal USDA – POA MGDHN
      </h1>

      <p>
        Panel integrado de seguimiento y análisis
      </p>

    </div>


    <div class="logo">
      ALE
    </div>

  </header>



  <!-- =====================================================
       NAVEGACIÓN
       ===================================================== -->

  <nav class="navigation">


    <!-- 1. LIDERAZGO DOCENTE -->

    <button
      class="tab active"
      onclick="cargarDashboard(0)"
    >
      Liderazgo Docente
    </button>



    <!-- 2. MANEJO SEGURO DE ALIMENTOS -->

    <button
      class="tab"
      onclick="cargarDashboard(1)"
    >
      Manejo de Alimentos CAE
    </button>



    <!-- 3. WASH CENTRO EDUCATIVO -->

    <button
      class="tab"
      onclick="cargarDashboard(2)"
    >
      WASH – Centro Educativo
    </button>



    <!-- 4. MANTENIMIENTO -->

    <button
      class="tab"
      onclick="cargarDashboard(3)"
    >
      Mantenimiento
    </button>



    <!-- 5. ACOMPAÑAMIENTO -->

    <button
      class="tab"
      onclick="cargarDashboard(4)"
    >
      Acompañamiento
    </button>



    <!-- 6. WASH OPERACIÓN Y MANTENIMIENTO -->

    <button
      class="tab"
      onclick="cargarDashboard(5)"
    >
      WASH – Operación y Mantenimiento
    </button>



    <!-- =================================================
         SELECTOR PARA CELULAR
         ================================================= -->

    <div class="selector">

      <select
        id="dashboardSelect"
        onchange="cargarDashboard(this.value)"
      >

        <option value="0">
          Liderazgo Docente
        </option>

        <option value="1">
          Manejo de Alimentos CAE
        </option>

        <option value="2">
          WASH – Centro Educativo
        </option>

        <option value="3">
          Mantenimiento
        </option>

        <option value="4">
          Acompañamiento
        </option>

        <option value="5">
          WASH – Operación y Mantenimiento
        </option>

      </select>

    </div>

  </nav>



  <!-- =====================================================
       VISOR
       ===================================================== -->

  <main class="viewer">


    <!-- PANTALLA DE CARGA -->

    <div
      class="loading"
      id="loading"
    >

      <div class="loading-content">

        <div class="spinner"></div>

        <span>
          Cargando dashboard...
        </span>

      </div>

    </div>



    <!-- DASHBOARD -->

    <iframe
      id="dashboard"
      title="Dashboard"
      src=""
      allowfullscreen
    >
    </iframe>


  </main>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       URL DE LOS 6 DASHBOARDS
       ===================================================== */

    const dashboards = [

      // 0 - Liderazgo Docente
      "https://oswaldoayala13.github.io/Taller-de-Liderazgo-Docente/",


      // 1 - Manejo seguro de alimentos CAE
      "https://oswaldoayala13.github.io/ALE_Manejo-de-seguro-de-alimentos-CAE/",


      // 2 - WASH Centro Educativo
      "https://oswaldoayala13.github.io/WASH-CENTRO-EDUCATIVO/",


      // 3 - Mantenimiento
      "https://oswaldoayala13.github.io/ALE_MANTENIMIENTO/",


      // 4 - Acompañamiento
      "https://oswaldoayala13.github.io/EDU_ACOMPANAMIENTO/",


      // 5 - WASH Operación y Mantenimiento
      "https://oswaldoayala13.github.io/WASH_Operacion_y_mantenimiento/"

    ];



    /* =====================================================
       ELEMENTOS HTML
       ===================================================== */

    const iframe =
      document.getElementById("dashboard");


    const loading =
      document.getElementById("loading");


    const tabs =
      document.querySelectorAll(".tab");


    const selector =
      document.getElementById("dashboardSelect");



    /* =====================================================
       FUNCIÓN PARA CARGAR DASHBOARD
       ===================================================== */

    function cargarDashboard(indice) {


      /* Convertir a número */

      indice =
        Number(indice);


      /* Validar índice */

      if (
        indice < 0 ||
        indice >= dashboards.length
      ) {

        indice = 0;

      }


      /* Mostrar pantalla de carga */

      loading.style.display =
        "flex";


      /* Cambiar dashboard */

      iframe.src =
        dashboards[indice];


      /* Actualizar pestañas */

      tabs.forEach(
        (tab, i) => {

          if (i === indice) {

            tab.classList.add("active");

          } else {

            tab.classList.remove("active");

          }

        }
      );


      /* Actualizar selector */

      selector.value =
        indice;

    }



    /* =====================================================
       OCULTAR CARGANDO CUANDO TERMINA
       ===================================================== */

    iframe.addEventListener(
      "load",
      function() {

        loading.style.display =
          "none";

      }
    );



    /* =====================================================
       CARGAR EL PRIMER DASHBOARD
       ===================================================== */

    cargarDashboard(0);


  </script>


</body>

</html>
